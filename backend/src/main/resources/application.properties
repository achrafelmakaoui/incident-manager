spring.application.name=backend
server.port=8080

# H2 (in-memory database; it is wiped at each restart)
spring.datasource.url=jdbc:h2:mem:incidentsdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.config.import=optional:file:.env[.properties]

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:300000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}